<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-label="driftfix reads CloudTrail logs from the customer's AWS account through a read-only role, runs four Lambda stages in its own account, and opens a pull request in the customer's GitHub repository.">
