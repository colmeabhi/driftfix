<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-label="Bedrock P50 latency stays near 5 seconds from 3 to 10 parallel stacks, while P99 latency climbs from 1.7 seconds at 1 stack to about 14 seconds at 10.">
<title>Bedrock P50 latency stays near 5 seconds from 3 to 10 parallel stacks, while P99 latency climbs from 1.7 seconds at 1 stack to about 14 seconds at 10.</title>
<style>
svg { font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
.bg     { fill: #ffffff; stroke: #d1d9e0; }
.ink    { fill: #1f2328; }
.muted  { fill: #59636e; }
.halo   { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
.region { fill: #64748b; fill-opacity: .05; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 5; }
.mono   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.title  { font-size: 14px; font-weight: 600; }
.sub    { font-size: 12px; }
.label  { font-size: 12px; }
.badge  { font-size: 13px; font-weight: 600; }
.edge   { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.flow   { stroke-dasharray: 6 7; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -13; } }
@media (prefers-color-scheme: dark) {
  .bg    { fill: #0d1117; stroke: #3d444d; }
  .ink   { fill: #f0f6fc; }
  .muted { fill: #9198a1; }
  .halo  { stroke: #0d1117; }
}
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}

.s1 { fill: #2a78d6; stroke: #2a78d6; }
.s2 { fill: #eb6834; stroke: #eb6834; }
.grid { stroke: #e3e6ea; stroke-width: 1; }
.axis { stroke: #8c959f; stroke-width: 1; }
.num  { font-variant-numeric: tabular-nums; }
.hollow { fill: #ffffff; stroke-width: 2; }
.line { fill: none !important; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot  { stroke: #ffffff; stroke-width: 2; }
.grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
.draw { animation: draw 1.4s ease-out both; }
.fade { animation: fade .5s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-color-scheme: dark) {
  .s1 { fill: #3987e5; stroke: #3987e5; }
  .s2 { fill: #d95926; stroke: #d95926; }
  .grid { stroke: #262c34; }
  .axis { stroke: #6e7681; }
  .hollow { fill: #0d1117; }
  .dot { stroke: #0d1117; }
}
@media (prefers-reduced-motion: reduce) {
  .grow, .draw, .fade { animation: none; }
  .draw { stroke-dashoffset: 0 !important; }
}
</style>
<rect class="bg" x="1" y="1" width="958" height="368" rx="14"/>
<text class="title ink" x="32" y="38">The typical call stays fast. The slowest calls do not.</text>
<text class="sub muted" x="32" y="58">Amazon Bedrock response time in seconds, by number of stacks processed in parallel</text>
<line class="line s1" x1="32" y1="78" x2="52" y2="78"/><circle class="s1 dot" cx="42" cy="78" r="4.5"/>
<text class="label ink" x="60" y="82">P50, the typical call</text>
<line class="line s2" x1="212" y1="78" x2="232" y2="78"/><circle class="s2 dot" cx="222" cy="78" r="4.5"/>
<text class="label ink" x="240" y="82">P99, the slowest 1%</text>
<circle class="s2 hollow" cx="400" cy="78" r="4.5"/><circle class="s1 hollow" cx="413" cy="78" r="4.5"/>
<text class="label ink" x="425" y="82">second run at 10 stacks</text>
<line class="axis" x1="80" y1="330.0" x2="760" y2="330.0"/>
<text class="label muted num" x="68" y="334.0" text-anchor="end">0 s</text>
<line class="grid" x1="80" y1="271.5" x2="760" y2="271.5"/>
<text class="label muted num" x="68" y="275.5" text-anchor="end">4 s</text>
<line class="grid" x1="80" y1="213.0" x2="760" y2="213.0"/>
<text class="label muted num" x="68" y="217.0" text-anchor="end">8 s</text>
<line class="grid" x1="80" y1="154.5" x2="760" y2="154.5"/>
<text class="label muted num" x="68" y="158.5" text-anchor="end">12 s</text>
<line class="grid" x1="80" y1="96.0" x2="760" y2="96.0"/>
<text class="label muted num" x="68" y="100.0" text-anchor="end">16 s</text>
<text class="label muted num" x="80.0" y="350" text-anchor="middle">1 stack</text>
<text class="label muted num" x="231.1" y="350" text-anchor="middle">3 stacks</text>
<text class="label muted num" x="457.8" y="350" text-anchor="middle">6 stacks</text>
<text class="label muted num" x="760.0" y="350" text-anchor="middle">10 stacks</text>
<path class="line s1 draw" d="M80.0,305.0 L231.1,262.6 L457.8,266.5 L760.0,255.3" stroke-dasharray="686" stroke-dashoffset="686"/>
<circle class="s1 dot fade" style="animation-delay:0.00s" cx="80.0" cy="305.0" r="5"/>
<circle class="s1 dot fade" style="animation-delay:0.35s" cx="231.1" cy="262.6" r="5"/>
<circle class="s1 dot fade" style="animation-delay:0.70s" cx="457.8" cy="266.5" r="5"/>
<circle class="s1 dot fade" style="animation-delay:1.05s" cx="760.0" cy="255.3" r="5"/>
<circle class="s1 hollow fade" style="animation-delay:1.4s" cx="760.0" cy="252.8" r="5"/>
<path class="line s2 draw" d="M80.0,305.0 L231.1,221.6 L457.8,188.7 L760.0,136.1" stroke-dasharray="708" stroke-dashoffset="708"/>
<circle class="s2 dot fade" style="animation-delay:0.00s" cx="80.0" cy="305.0" r="5"/>
<circle class="s2 dot fade" style="animation-delay:0.35s" cx="231.1" cy="221.6" r="5"/>
<circle class="s2 dot fade" style="animation-delay:0.70s" cx="457.8" cy="188.7" r="5"/>
<circle class="s2 dot fade" style="animation-delay:1.05s" cx="760.0" cy="136.1" r="5"/>
<circle class="s2 hollow fade" style="animation-delay:1.4s" cx="760.0" cy="112.7" r="5"/>
<text class="label ink num fade" style="animation-delay:1.5s" x="92.0" y="321.0" text-anchor="start">1.7 s for both</text>
<text class="label ink num fade" style="animation-delay:1.5s" x="774.0" y="141.1" text-anchor="start">P99 13.3 s</text>
<text class="label ink num fade" style="animation-delay:1.5s" x="774.0" y="113.7" text-anchor="start">14.9 s on the second run</text>
<text class="label ink num fade" style="animation-delay:1.5s" x="774.0" y="267.3" text-anchor="start">P50 5.1 s</text>
</svg>
