<g opacity="0"><circle class="fill-blue" r="13" fill-opacity=".25"/><circle class="fill-blue" r="7" stroke="#ffffff" stroke-width="2"/><animateMotion dur="10.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.15;0.24;0.3;0.39;0.45;0.54;0.6;0.69;0.75;0.84;1" keyPoints="0.00000;0.00000;0.20000;0.20000;0.40000;0.40000;0.60000;0.60000;0.80000;0.80000;1.00000;1.00000;1.00000" path="M90.0,152 L246.0,152 L402.0,152 L558.0,152 L714.0,152 L870.0,152"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" keyTimes="0.00000;0.84000;0.85500;1.00000" values="1;1;0;0"/></g>
<text class="title ink" x="90.0" y="87.0" text-anchor="middle">Manual change</text>
<text class="sub muted" x="90.0" y="105.0" text-anchor="middle">in the AWS Console</text>
<circle class="fill-red" cx="24.0" cy="50" r="11"/>
<text x="24.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
<text class="title ink" x="246.0" y="87.0" text-anchor="middle">CloudTrail</text>
<text class="sub muted" x="246.0" y="105.0" text-anchor="middle">records the API call</text>
<circle class="fill-slate" cx="180.0" cy="50" r="11"/>
<text x="180.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
<text class="title ink" x="402.0" y="87.0" text-anchor="middle">driftfix</text>
<text class="sub muted" x="402.0" y="105.0" text-anchor="middle">daily run spots it</text>
<circle class="fill-blue" cx="336.0" cy="50" r="11"/>
<text x="336.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
<text class="title ink" x="558.0" y="87.0" text-anchor="middle">Bedrock LLM</text>
<text class="sub muted" x="558.0" y="105.0" text-anchor="middle">rewrites the template</text>
<circle class="fill-purple" cx="492.0" cy="50" r="11"/>
<text x="492.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
<text class="title ink" x="714.0" y="87.0" text-anchor="middle">cfn-lint</text>
<text class="sub muted" x="714.0" y="105.0" text-anchor="middle">checks the result</text>
<circle class="fill-amber" cx="648.0" cy="50" r="11"/>
<text x="648.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
<text class="title ink" x="870.0" y="87.0" text-anchor="middle">Pull request</text>
<text class="sub muted" x="870.0" y="105.0" text-anchor="middle">a human reviews it</text>
<circle class="fill-green" cx="804.0" cy="50" r="11"/>
<text x="804.0" y="54.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
</svg>
