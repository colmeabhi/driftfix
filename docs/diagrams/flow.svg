<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" role="img" aria-label="The path from a manual console change to a pull request, in six steps.">
<title>The path from a manual console change to a pull request, in six steps.</title>
<style>
svg { font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
.bg     { fill: #ffffff; stroke: #d1d9e0; }
.ink    { fill: #1f2328; }
.muted  { fill: #59636e; }
.halo   { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
.region { fill: #64748b; fill-opacity: .05; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 3 5; }
.mono   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.title  { font-size: 14px; font-weight: 600; }
.sub    { font-size: 12px; }
.label  { font-size: 12px; }
.badge  { font-size: 13px; font-weight: 600; }
.edge   { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.flow   { stroke-dasharray: 6 7; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -13; } }
@media (prefers-color-scheme: dark) {
  .bg    { fill: #0d1117; stroke: #3d444d; }
  .ink   { fill: #f0f6fc; }
  .muted { fill: #9198a1; }
  .halo  { stroke: #0d1117; }
}
@media (prefers-reduced-motion: reduce) {
  .flow { animation: none; }
}

.box-blue  { fill: #3b82f6; fill-opacity: .12; stroke: #3b82f6; stroke-width: 2; }
.glow-blue { fill: #3b82f6; fill-opacity: .30; stroke: #3b82f6; stroke-width: 4; opacity: 0; }
.edge-blue { stroke: #3b82f6; }
.fill-blue { fill: #3b82f6; }
.box-green  { fill: #16a34a; fill-opacity: .12; stroke: #16a34a; stroke-width: 2; }
.glow-green { fill: #16a34a; fill-opacity: .30; stroke: #16a34a; stroke-width: 4; opacity: 0; }
.edge-green { stroke: #16a34a; }
.fill-green { fill: #16a34a; }
.box-amber  { fill: #d97706; fill-opacity: .12; stroke: #d97706; stroke-width: 2; }
.glow-amber { fill: #d97706; fill-opacity: .30; stroke: #d97706; stroke-width: 4; opacity: 0; }
.edge-amber { stroke: #d97706; }
.fill-amber { fill: #d97706; }
.box-red  { fill: #dc2626; fill-opacity: .12; stroke: #dc2626; stroke-width: 2; }
.glow-red { fill: #dc2626; fill-opacity: .30; stroke: #dc2626; stroke-width: 4; opacity: 0; }
.edge-red { stroke: #dc2626; }
.fill-red { fill: #dc2626; }
.box-purple  { fill: #8b5cf6; fill-opacity: .12; stroke: #8b5cf6; stroke-width: 2; }
.glow-purple { fill: #8b5cf6; fill-opacity: .30; stroke: #8b5cf6; stroke-width: 4; opacity: 0; }
.edge-purple { stroke: #8b5cf6; }
.fill-purple { fill: #8b5cf6; }
.box-slate  { fill: #64748b; fill-opacity: .12; stroke: #64748b; stroke-width: 2; }
.glow-slate { fill: #64748b; fill-opacity: .30; stroke: #64748b; stroke-width: 4; opacity: 0; }
.edge-slate { stroke: #64748b; }
.fill-slate { fill: #64748b; }
@keyframes glow0 { 0.0% { opacity: 0; } 0.01% { opacity: 0; } 0.02% { opacity: 1; } 9.0% { opacity: 1; } 11.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow0 { animation: glow0 10.0s linear infinite; }
@keyframes glow1 { 0.0% { opacity: 0; } 12.5% { opacity: 0; } 15.0% { opacity: 1; } 24.0% { opacity: 1; } 26.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow1 { animation: glow1 10.0s linear infinite; }
@keyframes glow2 { 0.0% { opacity: 0; } 27.5% { opacity: 0; } 30.0% { opacity: 1; } 39.0% { opacity: 1; } 41.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow2 { animation: glow2 10.0s linear infinite; }
@keyframes glow3 { 0.0% { opacity: 0; } 42.5% { opacity: 0; } 45.0% { opacity: 1; } 54.0% { opacity: 1; } 56.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow3 { animation: glow3 10.0s linear infinite; }
@keyframes glow4 { 0.0% { opacity: 0; } 57.5% { opacity: 0; } 60.0% { opacity: 1; } 69.0% { opacity: 1; } 71.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow4 { animation: glow4 10.0s linear infinite; }
@keyframes glow5 { 0.0% { opacity: 0; } 72.5% { opacity: 0; } 75.0% { opacity: 1; } 84.0% { opacity: 1; } 86.5% { opacity: 0; } 100.0% { opacity: 0; } }
.glow5 { animation: glow5 10.0s linear infinite; }</style>
<defs><marker id="head-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-blue" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-blue-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-blue" d="M10,0 L0,5 L10,10 z"/></marker><marker id="head-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-green" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-green-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-green" d="M10,0 L0,5 L10,10 z"/></marker><marker id="head-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-amber" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-amber-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-amber" d="M10,0 L0,5 L10,10 z"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-red" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-red-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-red" d="M10,0 L0,5 L10,10 z"/></marker><marker id="head-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-purple" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-purple-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-purple" d="M10,0 L0,5 L10,10 z"/></marker><marker id="head-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-slate" d="M0,0 L10,5 L0,10 z"/></marker><marker id="head-slate-back" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fill-slate" d="M10,0 L0,5 L10,10 z"/></marker></defs>
<rect class="bg" x="1" y="1" width="958" height="168" rx="14"/>
<rect class="box-red" x="24.0" y="50" width="132" height="80" rx="12"/>
<rect class="box-slate" x="180.0" y="50" width="132" height="80" rx="12"/>
<path class="edge edge-slate flow" d="M161.0,90.0 L174.0,90.0" marker-end="url(#head-slate)"/>
