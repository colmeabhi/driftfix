<path class="edge edge-slate flow" d="M473.0,90.0 L486.0,90.0" marker-end="url(#head-slate)"/>
<rect class="box-amber" x="648.0" y="50" width="132" height="80" rx="12"/>
<path class="edge edge-slate flow" d="M629.0,90.0 L642.0,90.0" marker-end="url(#head-slate)"/>
<rect class="box-green" x="804.0" y="50" width="132" height="80" rx="12"/>
<path class="edge edge-slate flow" d="M785.0,90.0 L798.0,90.0" marker-end="url(#head-slate)"/>
<path class="edge edge-slate" stroke-opacity=".35" d="M90.0,152 L870.0,152"/>
<rect class="glow-red glow0" x="24.0" y="50" width="132" height="80" rx="12"/>
<rect class="glow-slate glow1" x="180.0" y="50" width="132" height="80" rx="12"/>
