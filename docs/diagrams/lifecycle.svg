<path class="edge edge-red flow" d="M440,180 L440,290 L654,290" marker-end="url(#head-red)"/>
<path class="edge edge-red flow" d="M775,320 L775,350 L190,350 L190,216" marker-end="url(#head-red)"/>
<rect class="glow-blue glow0" x="100" y="150" width="180" height="60" rx="12"/>
<rect class="glow-green glow1" x="660" y="40" width="230" height="60" rx="12"/>
<rect class="glow-slate glow2" x="660" y="150" width="230" height="60" rx="12"/>
<rect class="glow-red glow3" x="660" y="260" width="230" height="60" rx="12"/>
<g opacity="0"><circle class="fill-green" r="13" fill-opacity=".25"/><circle class="fill-green" r="7" stroke="#ffffff" stroke-width="2"/><animateMotion dur="24.45s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.02517;0.04971;0.08904;0.10634;0.15904;0.20403;1" keyPoints="0.00000;0.18713;0.18713;0.47953;0.60819;1.00000;1.00000;1.00000" path="M30,180 L190.0,180.0 L440,180 L440,70 L775.0,70.0"/><animate attributeName="opacity" dur="24.45s" repeatCount="indefinite" keyTimes="0.00000;0.20403;0.21016;1.00000" values="1;1;0;0"/></g>
<g opacity="0"><circle class="fill-slate" r="13" fill-opacity=".25"/><circle class="fill-slate" r="7" stroke="#ffffff" stroke-width="2"/><animateMotion dur="24.45s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22039;0.24556;0.2701;0.36212;0.40711;1" keyPoints="0.00000;0.00000;0.21477;0.21477;1.00000;1.00000;1.00000" path="M30,180 L190.0,180.0 L775.0,180.0"/><animate attributeName="opacity" dur="24.45s" repeatCount="indefinite" keyTimes="0.00000;0.21425;0.22652;0.40711;0.41325;1.00000" values="0;0;1;1;0;0"/></g>
<g opacity="0"><circle class="fill-red" r="13" fill-opacity=".25"/><circle class="fill-red" r="7" stroke="#ffffff" stroke-width="2"/><animateMotion dur="24.45s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.42347;0.44864;0.47318;0.51251;0.52981;0.58251;0.61932;0.62876;0.72078;0.74752;0.77615;0.81548;0.83278;0.88548;0.93456;1" keyPoints="0.00000;0.00000;0.06765;0.06765;0.17336;0.21987;0.36152;0.36152;0.38689;0.63425;0.70613;0.70613;0.81184;0.85835;1.00000;1.00000;1.00000" path="M30,180 L190.0,180.0 L440,180 L440,290 L775.0,290.0 L775,350 L190,350 L190.0,180.0 L440,180 L440,70 L775.0,70.0"/><animate attributeName="opacity" dur="24.45s" repeatCount="indefinite" keyTimes="0.00000;0.41734;0.42961;0.93456;0.94070;1.00000" values="0;0;1;1;0;0"/></g>
<text class="title ink" x="190.0" y="177.0" text-anchor="middle">queued</text>
<text class="sub muted" x="190.0" y="195.0" text-anchor="middle">picked up by a run</text>
<text class="title ink" x="775.0" y="67.0" text-anchor="middle">pr_opened</text>
<text class="sub muted" x="775.0" y="85.0" text-anchor="middle">done: a PR carries the fix</text>
<text class="title ink" x="775.0" y="177.0" text-anchor="middle">no_change</text>
<text class="sub muted" x="775.0" y="195.0" text-anchor="middle">done: nothing to fix</text>
<text class="title ink" x="775.0" y="287.0" text-anchor="middle">failed</text>
<text class="sub muted" x="775.0" y="305.0" text-anchor="middle">a stage reported an error</text>
<text class="label muted" x="18" y="162" text-anchor="start">new event</text>
<text class="label muted halo" x="540" y="170" text-anchor="middle">model changed nothing</text>
<text class="label muted halo" x="548" y="60" text-anchor="middle">pull request created</text>
<text class="label muted halo" x="548" y="280" text-anchor="middle">lint, GitHub or model error</text>
<text class="label muted halo" x="482" y="341" text-anchor="middle">retried on the next daily run, max 3 attempts</text>
</svg>
