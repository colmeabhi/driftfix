<text class="title ink" x="160.0" y="69.0" text-anchor="middle">Amazon Bedrock</text>
<text class="sub muted" x="160.0" y="87.0" text-anchor="middle">writes the template</text>
<text class="title ink" x="160.0" y="199.0" text-anchor="middle">Stack Processor</text>
<text class="sub muted" x="160.0" y="217.0" text-anchor="middle">asks the model</text>
<text class="title ink" x="480.0" y="199.0" text-anchor="middle">Validator</text>
<text class="sub muted" x="480.0" y="217.0" text-anchor="middle">runs cfn-lint</text>
<text class="title ink" x="800.0" y="199.0" text-anchor="middle">PR Creator</text>
<text class="sub muted" x="800.0" y="217.0" text-anchor="middle">opens the pull request</text>
<text class="label muted halo" x="320" y="178" text-anchor="middle">template</text>
<text class="label muted halo" x="320" y="236" text-anchor="middle">lint errors</text>
<text class="label muted halo" x="640" y="192" text-anchor="middle">passes</text>
<text class="label muted" x="480" y="300" text-anchor="middle">At most 3 retries. After that the events are marked failed and an alarm fires.</text>
<g class="show0"><rect class="fill-red" x="400" y="252" width="160" height="28" rx="14"/><text class="badge" x="480" y="271" text-anchor="middle" fill="#ffffff">attempt 1: 2 errors</text></g>
<g class="show1"><rect class="fill-green" x="400" y="252" width="160" height="28" rx="14"/><text class="badge" x="480" y="271" text-anchor="middle" fill="#ffffff">attempt 2: clean</text></g>
</svg>
